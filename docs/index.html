<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hands-Off Timer</title>
  <meta name="description" content="Hands-Off Timer — consecutive countdown timers for iPhone. Privacy policy and support.">
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8eef6;
      --muted: #9aa8b8;
      --accent: #5b9fd4;
      --border: #2a3544;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    .tag { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .card a:hover { text-decoration: underline; }
    .card p { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.9rem; }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Hands-Off Timer</h1>
    <p class="tag">Consecutive countdown timers for iPhone</p>
    <div class="card">
      <a href="privacy.html">Privacy Policy</a>
      <p>How the app handles data on your device.</p>
    </div>
    <div class="card">
      <a href="support.html">Support</a>
      <p>Need help? Contact and issue reporting.</p>
    </div>
    <footer>
      Jacob Mueller · <a href="mailto:mueller.4@gmail.com">mueller.4@gmail.com</a>
    </footer>
  </main>
</body>
</html>
